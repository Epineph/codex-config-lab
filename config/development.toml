# Select a model with /model first; xhigh support depends on the model/client.
# The installer can add the exact model ID with --model.
model_reasoning_effort = "xhigh"
plan_mode_reasoning_effort = "xhigh"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "live"

[sandbox_workspace_write]
# Allows agent-run dependency downloads. This cannot fix host login or uploads.
network_access = true
